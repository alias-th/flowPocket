services:
  app:
  # กำหนดให้สร้าง application image จาก Dockerfile
    build:
      context: . ## ส่งไฟล์จาก project directory เป็น build context
      dockerfile: Dockerfile ## dockerfile: Dockerfile ระบุ Dockerfile ที่ใช้
    container_name: flowpocket-api
    restart: unless-stopped ## ให้ Docker เริ่ม container ใหม่เมื่อ application ล้มเหลวหรือ Docker daemon restart 
    env_file:
      - .env ## โหลด environment variables จาก .env เข้า application container
    environment: ## กำหนดค่าที่ต้องใช้เฉพาะภายใน container โดยค่าตรงนี้จะ override ค่าชื่อเดียวกันจาก .env
      NODE_ENV: production
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports: ## HOST_PORT:CONTAINER_PORT
      - "${PORT:-8080}:8080"
    depends_on: ## กำหนดให้ app รอจน PostgreSQL ผ่าน health check ก่อนเริ่ม container
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: flowpocket-postgres
    restart: unless-stopped
    environment: ## ส่งค่าจาก .env ไปยัง official PostgreSQL image เพื่อใช้สร้าง
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ## เปิด PostgreSQL ให้เครื่อง host เชื่อมต่อได้
      - "${POSTGRES_PORT}:5432"
    volumes: ## เชื่อม named volume postgres_data เข้ากับ directory ที่ PostgreSQL ใช้เก็บข้อมูล
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
# เป็นการประกาศ named volume เพื่อให้ Compose จัดการ lifecycle
volumes:
  postgres_data:
